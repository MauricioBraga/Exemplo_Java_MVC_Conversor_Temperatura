name: Build Swing JAR (Plain Java) and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessário para criar releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura o Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      #  Cria diretório de build
      - name: Create build directory
        run: mkdir -p build/classes

      # Compila o código Java
      - name: Compile Java sources
        run: |
          javac \
            -encoding UTF-8 \
            -source 17 \
            -target 17 \
            -d build/classes \
            $(find src -name "*.java")

      # Cria arquivo JAR 
      - name: Create executable JAR
        run: |
          echo "Main-Class: br.com.exemploMVC.Main" > manifest.txt
          jar cfm ConversorTemperaturaMVCSwing-${{ github.ref_name }}.jar manifest.txt -C build/classes .

      # Cria release no GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release oficial do Conversor de Temperatura (Java Swing).
          files: ConversorTemperaturaMVCSwing-${{ github.ref_name }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
