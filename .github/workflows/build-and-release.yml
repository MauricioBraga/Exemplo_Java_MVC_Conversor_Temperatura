name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Create bin directory
      run: mkdir -p bin

    - name: Compile Java code
      run: javac -d bin -sourcepath src src/br/com/exemploMVC/Main.java

    - name: Create JAR file
      run: |
        cd bin
        jar cfe ../Exemplo_MVC_Conversor_Temperatura.jar br.com.exemploMVC.Main br/

    - name: Extract version from pom.xml or use git tag
      id: version
      run: |
        VERSION=$(date +%Y.%m.%d)
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/create-release@v1
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
        release_name: Release v${{ steps.version.outputs.version }}-${{ github.run_number }}
        body: |
          ## Alterações
          - **Commit:** ${{ github.sha }}
          - **Autor:** ${{ github.actor }}
          
          ### Como usar
          ```bash
          java -jar Exemplo_MVC_Conversor_Temperatura.jar
          ```
        draft: false
        prerelease: false

    - name: Upload JAR Asset
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./Exemplo_MVC_Conversor_Temperatura.jar
        asset_name: Exemplo_MVC_Conversor_Temperatura.jar
        asset_content_type: application/java-archive
